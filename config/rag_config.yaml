# PolarisRAG v2.0 RAG 模式配置文件

mode: rag

# LLM 配置
llm:
  model: gpt-4o-mini
  temperature: 0.7
  max_tokens: null

# Embedding 配置
embeddings:
  model: text-embedding-3-small

# 向量存储配置
vector_store:
  type: milvus
  connection_args:
    host: localhost
    port: 19530
  collection_name: polarisrag_rag
  drop_old: false

# 工作目录
working_dir: ./documents

# RAG 提示词模板（可选）
# 留空则使用默认模板
rag_template: null

# LLM 提示词模板（可选）
# 留空则使用默认模板
llm_template: null

